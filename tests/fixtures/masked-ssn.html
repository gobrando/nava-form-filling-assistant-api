<!doctype html>
<!--
  A masked Social Security box next to an ordinary name box.
  No household value is stored in this fixture.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Masked identifier — fixture</title>
  </head>
  <body>
    <form id="masked-identifier">
      <label for="applicant-name">Name</label>
      <input id="applicant-name" name="name" type="text" />

      <label for="applicant-ssn">Social Security Number</label>
      <input id="applicant-ssn" name="ssn" type="password" autocomplete="off" />
    </form>
  </body>
</html>
