<!doctype html>
<!--
  Moss County WIC. The served selectors are unchanged, and the county
  added a required household question the playbook does not know. That
  control should stay unmapped. It must not block a repair of the fields
  the playbook already has, and a green repair must not pretend to fill it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Moss County WIC application</title>
  </head>
  <body>
    <h1>Apply for WIC in Moss County</h1>
    <p>
      The clinic uses this form to set an appointment. Household size is
      a new question on this year's page.
    </p>
    <form id="wic-application">
      <label for="edit-name">Name</label>
      <input id="edit-name" name="name" type="text" required />

      <label for="edit-phone">Phone</label>
      <input id="edit-phone" name="phone" type="tel" />

      <label for="edit-email">Email</label>
      <input id="edit-email" name="email" type="email" />

      <label for="edit-zip-code">Zip code</label>
      <input id="edit-zip-code" name="zip_code" type="text" maxlength="5" />

      <label for="edit-preferred-language">Preferred language</label>
      <select id="edit-preferred-language" name="preferred_language">
        <option value="">- Select -</option>
        <option>English</option>
        <option>Spanish</option>
      </select>

      <label for="edit-please-choose-the-wic-clinic-closest-to-you">
        Please choose the WIC clinic closest to you
      </label>
      <select id="edit-please-choose-the-wic-clinic-closest-to-you" name="clinic" required>
        <option value="">- Select -</option>
        <option>Moss County WIC</option>
        <option>North Fork WIC</option>
      </select>

      <label for="household-count">How many people are in your household?</label>
      <input id="household-count" name="household_count" type="number" required />

      <div id="captcha-gate">Verify you are human</div>
      <button id="edit-submit" type="submit">Submit</button>
    </form>
  </body>
</html>
